name: Fathom
options:
  bundleIdPrefix: com.fathom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fathom:
    type: application
    platform: iOS
    sources: [Fathom]
    info:
      path: Fathom/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fathom
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Fathom connects to the underwriting server on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fathom.marine
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [FathomTests]
  FathomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FathomTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Fathom
